"$schema" = "https://starship.rs/config-schema.json"

palette = "catppuccin_mocha"

format = """$directory$git_branch$git_status$nodejs$python$rust$golang$cmd_duration$character"""

[character]
success_symbol = "[](bold green)"
error_symbol = "[](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold lavender"

[git_branch]
symbol = " "
style = "bold mauve"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold peach"

[nodejs]
symbol = " "
style = "bold green"

[python]
symbol = " "
style = "bold yellow"

[rust]
symbol = " "
style = "bold peach"

[golang]
symbol = " "
style = "bold sky"

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
