# ============================================================================
# Animations — Balanced Preset
# ============================================================================

animations {
    enabled = true
}

# Custom bezier curves
bezier = myBezier, 0.05, 0.9, 0.1, 1.05
bezier = easeOut, 0.0, 0.0, 0.2, 1.0
bezier = linear, 1, 1, 0, 0

# Window open/close
animation = windows, 1, 7, myBezier, slide
animation = windowsOut, 1, 5, easeOut, slide

# Fade transitions
animation = fade, 1, 5, myBezier

# Workspace switching
animation = workspaces, 1, 6, myBezier, slidefade 20%

# Scratchpad (special workspace) — vertical slide
animation = specialWorkspace, 1, 5, myBezier, slidevert

# Border color transitions
animation = border, 1, 10, default

# Border angle — render once, not looping (saves battery)
animation = borderangle, 1, 20, linear, once
