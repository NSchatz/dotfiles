# ============================================================================
# Keybinds — i3-like with descriptions
# ============================================================================

$mainMod = SUPER

# ============================================================================
# Application Launchers
# ============================================================================

bindd = $mainMod, Return, Launch terminal, exec, $terminal
bindd = $mainMod, D, Open application launcher, exec, $menu
bindd = $mainMod, E, Open file manager, exec, $fileManager

# ============================================================================
# Window Management
# ============================================================================

bindd = $mainMod, Q, Close active window, killactive,
bindd = $mainMod, V, Toggle floating, togglefloating,
bindd = $mainMod, F, Toggle fullscreen, fullscreen, 0
bindd = $mainMod, P, Toggle pseudo-tiling, pseudo,

# ============================================================================
# Focus Movement — hjkl + arrows
# ============================================================================

bindd = $mainMod, H, Focus left, movefocus, l
bindd = $mainMod, L, Focus right, movefocus, r
bindd = $mainMod, K, Focus up, movefocus, u
bindd = $mainMod, J, Focus down, movefocus, d

bindd = $mainMod, left, Focus left, movefocus, l
bindd = $mainMod, right, Focus right, movefocus, r
bindd = $mainMod, up, Focus up, movefocus, u
bindd = $mainMod, down, Focus down, movefocus, d

# ============================================================================
# Move Windows — SHIFT + hjkl + arrows
# ============================================================================

bindd = $mainMod SHIFT, H, Move window left, movewindow, l
bindd = $mainMod SHIFT, L, Move window right, movewindow, r
bindd = $mainMod SHIFT, K, Move window up, movewindow, u
bindd = $mainMod SHIFT, J, Move window down, movewindow, d

bindd = $mainMod SHIFT, left, Move window left, movewindow, l
bindd = $mainMod SHIFT, right, Move window right, movewindow, r
bindd = $mainMod SHIFT, up, Move window up, movewindow, u
bindd = $mainMod SHIFT, down, Move window down, movewindow, d

# ============================================================================
# Workspaces — Switch
# ============================================================================

bindd = $mainMod, 1, Switch to workspace 1, workspace, 1
bindd = $mainMod, 2, Switch to workspace 2, workspace, 2
bindd = $mainMod, 3, Switch to workspace 3, workspace, 3
bindd = $mainMod, 4, Switch to workspace 4, workspace, 4
bindd = $mainMod, 5, Switch to workspace 5, workspace, 5
bindd = $mainMod, 6, Switch to workspace 6, workspace, 6
bindd = $mainMod, 7, Switch to workspace 7, workspace, 7
bindd = $mainMod, 8, Switch to workspace 8, workspace, 8
bindd = $mainMod, 9, Switch to workspace 9, workspace, 9
bindd = $mainMod, 0, Switch to workspace 10, workspace, 10

# ============================================================================
# Workspaces — Move Window To
# ============================================================================

bindd = $mainMod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move window to workspace 10, movetoworkspace, 10

# ============================================================================
# Workspace Scroll + Tab
# ============================================================================

bindd = $mainMod, mouse_down, Scroll to next workspace, workspace, e+1
bindd = $mainMod, mouse_up, Scroll to previous workspace, workspace, e-1
bindd = $mainMod, Tab, Cycle to next open workspace, workspace, e+1

# ============================================================================
# Mouse Binds
# ============================================================================

bindmd = $mainMod, mouse:272, Move window with mouse, movewindow
bindmd = $mainMod, mouse:273, Resize window with mouse, resizewindow

# ============================================================================
# Scratchpad (Special Workspace)
# ============================================================================

bindd = $mainMod, S, Toggle scratchpad, togglespecialworkspace, terminal
bindd = $mainMod SHIFT, S, Move window to scratchpad, movetoworkspacesilent, special:terminal

# ============================================================================
# Screenshots
# ============================================================================

bindd = , Print, Screenshot full screen, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bindd = SHIFT, Print, Screenshot region to file, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
bindd = CTRL, Print, Screenshot region to clipboard, exec, grim -g "$(slurp)" - | wl-copy

# ============================================================================
# Clipboard History
# ============================================================================

bindd = $mainMod, V, Open clipboard history, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# ============================================================================
# Session
# ============================================================================

bindd = $mainMod, Escape, Lock session, exec, loginctl lock-session
bindd = $mainMod, X, Open logout menu, exec, wlogout

# ============================================================================
# Media / Brightness Keys
# ============================================================================

bindeld = , XF86AudioRaiseVolume, Raise volume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Lower volume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld = , XF86AudioMute, Toggle mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = , XF86AudioMicMute, Toggle mic mute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindld = , XF86AudioPlay, Play/Pause media, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

bindeld = , XF86MonBrightnessUp, Increase brightness, exec, brightnessctl set 5%+
bindeld = , XF86MonBrightnessDown, Decrease brightness, exec, brightnessctl set 5%-

# ============================================================================
# Hyprsunset Toggle
# ============================================================================

bindd = $mainMod, N, Toggle night light, exec, pkill hyprsunset || hyprsunset -t 4500

# ============================================================================
# Launch Submap — SUPER+Space then key
# ============================================================================

bindd = $mainMod, Space, Enter launch mode, submap, launch

submap = launch, reset

bindd = , F, Launch Firefox, exec, firefox
bindd = , T, Launch terminal, exec, $terminal
bindd = , E, Launch file manager, exec, $fileManager
bindd = , B, Launch Bluetooth manager, exec, blueman-manager
bindd = , S, Launch Spotify, exec, spotify
bindd = , escape, Cancel launch mode, submap, reset

submap = reset
