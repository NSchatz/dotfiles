# ============================================================================
# Autostart Applications
# ============================================================================

# Authentication agent
exec-once = systemctl --user start hyprpolkitagent

# Status bar
exec-once = waybar

# Wallpaper slideshow (catppuccin-mocha collection, cycles every 5 min)
exec-once = awww-daemon && ~/.config/hypr/scripts/wallpaper-cycle.sh

# Notification daemon
exec-once = swaync

# Idle daemon (lock/dpms)
exec-once = hypridle

# Network manager applet
exec-once = nm-applet --indicator

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Removable media automount
exec-once = udiskie &

# Bluetooth applet
exec-once = blueman-applet

# Terminal scratchpad — auto-launch kitty on special workspace
exec-once = [workspace special:terminal silent] kitty
