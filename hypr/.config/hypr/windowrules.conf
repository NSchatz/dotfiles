# ============================================================================
# Window Rules — Catppuccin Mocha
# ============================================================================

# ============================================================================
# Float Rules
# ============================================================================

windowrule {
    name = float-pavucontrol
    match:class = pavucontrol
    float = on
    size = 800 600
    center = on
}

windowrule {
    name = float-nm-editor
    match:class = nm-connection-editor
    float = on
    center = on
}

windowrule {
    name = float-blueman
    match:class = blueman-manager
    float = on
    size = 700 500
    center = on
}

windowrule {
    name = float-thunar-dialogs
    match:class = thunar
    match:title = (File Operation Progress|Confirm to replace files)
    float = on
    center = on
}

# ============================================================================
# Kitty — transparent with frosted glass
# ============================================================================

windowrule {
    name = opacity-kitty
    match:class = kitty
    opacity = 0.85 override 0.75 override
}

# ============================================================================
# VS Code — Catppuccin Mocha transparency
# ============================================================================

windowrule {
    name = opacity-vscode
    match:class = code-oss
    opacity = 0.85 override 0.75 override
}

# ============================================================================
# Opacity Overrides — Force opaque for media and browsers
# ============================================================================

windowrule {
    name = opaque-firefox
    match:class = firefox
    opaque = on
}

windowrule {
    name = opaque-chromium
    match:class = (chromium|google-chrome|brave-browser)
    opaque = on
}

windowrule {
    name = opaque-fullscreen
    match:fullscreen = true
    opaque = on
}

windowrule {
    name = opaque-steam
    match:class = steam
    opaque = on
}

# ============================================================================
# Spotify — opacity override for media player
# ============================================================================

windowrule {
    name = spotify-opacity
    match:initial_class = spotify
    opacity = 0.95 override 0.85 override
}

# ============================================================================
# Layer Rules — Blur for bars and launchers
# ============================================================================

layerrule = blur true, match:namespace waybar
layerrule = blur true, match:namespace rofi
layerrule = blur true, match:namespace swaync-control-center
layerrule = blur true, match:namespace notifications
