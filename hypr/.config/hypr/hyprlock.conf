# Hyprlock Configuration — Catppuccin Mocha
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
}

# Solid Catppuccin Base background
background {
    monitor =
    color = rgba(1e1e2eff)
}

# Password input field
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>  Enter Password...</i>
    hide_input = false
    rounding = 10
    check_color = rgba(fab387ff)
    fail_color = rgba(f38ba8ff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(f9e2afff)
    position = 0, -80
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(bac2deff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Battery indicator (top-right)
label {
    monitor =
    text = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT0/capacity)%  "
    color = rgba(a6e3a1ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -30, -20
    halign = right
    valign = top
}

# Greeting
label {
    monitor =
    text = Hi, $USER
    color = rgba(b4befeff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}
