# ============================================================================
# Hyprland Configuration — Catppuccin Mocha
# ============================================================================

# Variables — must be defined before any source lines
$terminal = kitty
$menu = rofi -show drun
$fileManager = thunar

# Source sub-configs
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/animations.conf

# ============================================================================
# General
# ============================================================================

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(585b70cc)

    resize_on_border = true
    layout = dwindle
    allow_tearing = false
}

# ============================================================================
# Decoration
# ============================================================================

decoration {
    rounding = 10
    rounding_power = 2.0

    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.15
    dim_special = 0.3

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.0117
        contrast = 0.9
        brightness = 0.8
        vibrancy = 0.17
        vibrancy_darkness = 0.0
        new_optimizations = true
        xray = false
        special = true
        popups = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1a1abb)
        color_inactive = rgba(1a1a1a44)
        offset = 0 0
        scale = 1.0
    }
}

# ============================================================================
# Input
# ============================================================================

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0.0

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

# ============================================================================
# Gestures
# ============================================================================

gestures {
    workspace_swipe_create_new = true
}

gesture = 3, horizontal, workspace

# ============================================================================
# Dwindle Layout
# ============================================================================

dwindle {
    pseudotile = true
    preserve_split = true
}

# ============================================================================
# Misc
# ============================================================================

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    animate_manual_resizes = true
    focus_on_activate = false
    enable_swallow = false
}

# ============================================================================
# Cursor
# ============================================================================

cursor {
    enable_hyprcursor = true
    sync_gsettings_theme = true
}

# ============================================================================
# XWayland
# ============================================================================

xwayland {
    force_zero_scaling = true
}
